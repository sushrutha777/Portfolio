<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushrutha S Kottary | GenAI & Data Science Engineer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              cyan: '#2DD4BF',
              purple: '#7000ff',
              blue: '#0066ff'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #0f172a;
    }

    .dark {
      --bg-color: #000000;
      --text-color: #f8fafc;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.5s ease;
    }

    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .light .glass {
      background: rgba(15, 23, 42, 0.03);
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    .gradient-text {
      background: linear-gradient(135deg, #2DD4BF 0%, #7000ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hover-3d {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      perspective: 1000px;
    }

    .hover-3d:hover {
      transform: translateY(-8px) rotateX(4deg) rotateY(4deg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .dark .hover-3d:hover {
      box-shadow: 0 20px 40px rgba(0, 242, 255, 0.1);
    }

    @keyframes scanline {
      0% {
        transform: translateY(-100%);
      }

      100% {
        transform: translateY(100%);
      }
    }

    .scanline::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, transparent, rgba(0, 242, 255, 0.05), transparent);
      animation: scanline 8s linear infinite;
      pointer-events: none;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="selection:bg-brand-cyan/30 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
